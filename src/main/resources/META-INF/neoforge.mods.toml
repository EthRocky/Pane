license = "MIT"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "EthRocky"
description = "A GUI library: a modern component kit with an optional HTML/CSS-like authoring layer, rendered through Minecraft's own pipeline."
logoFile = "assets/pane/icon.png"
# Client-only: servers must not require it.
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "pane.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "CLIENT"
